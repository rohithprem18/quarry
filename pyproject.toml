[project]
name = "quarry"
version = "1.0.0"
description = "Text-to-SQL agent with schema linking and execution-guided repair, evaluated on BIRD"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi==0.115.6", "httpx==0.28.1", "sqlglot==26.6.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
